name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: rag_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.18.2
        ports:
          - 6333:6333
          - 6334:6334

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag_test
      QDRANT_URL: http://localhost:6333
      LM_STUDIO_BASE_URL: http://localhost:1234/v1
      LM_STUDIO_API_KEY: lm-studio
      LM_STUDIO_CHAT_MODEL: ci-placeholder-chat-model
      LM_STUDIO_EMBEDDING_MODEL: ci-placeholder-embedding-model
      JWT_SECRET_KEY: ci-placeholder-secret-at-least-32-characters
      DEMO_MODE_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Audit Python dependencies
        run: |
          python -m pip install bandit==1.9.4 mypy==1.18.2 pip-audit==2.10.1
          pip-audit -r requirements.lock
          bandit -r app -q
          mypy app --ignore-missing-imports

      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run unit and integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: pytest -v

      - name: Validate Docker image
        run: docker build --tag ai-rag-platform:ci .
